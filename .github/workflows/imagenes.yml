# Construye las imagenes del backend y del frontend y las publica en GitHub Container Registry.
# - Pull requests: pruebas y construccion de ambas imagenes, sin iniciar sesion ni publicar.
# - Push a main y ejecucion manual desde main: pruebas y publicacion en GHCR.
# - Push de etiquetas vX.Y.Z: publicacion solo si el commit etiquetado pertenece al historial de main.
# - Ejecucion manual desde otra rama o desde una etiqueta: solo pruebas y construccion, sin publicar.
# No despliega en Kubernetes: el despliegue usa los digests que este workflow muestra en el resumen.
# Las acciones estan fijadas por commit; el comentario indica la version publicada.
name: Imagenes de contenedor

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imagenes-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGEN_BASE: ghcr.io/kerosene21/procesos-empresariales

jobs:
  backend:
    name: Pruebas del backend con PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: procesos_empresariales_test
          POSTGRES_USER: procesos_app
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U procesos_app -d procesos_empresariales_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # Clave de la base efimera del servicio de pruebas, igual que en sonar.yml; no es un secreto.
    env:
      TEST_DB_USERNAME: procesos_app
      DB_PASSWORD: ci_test_password

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar la suite completa
        run: ./mvnw -B clean verify

  frontend:
    name: Pruebas del frontend Angular
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Ejecutar las pruebas
        run: npx ng test --watch=false

      - name: Compilar para produccion
        run: npx ng build --configuration production

  verificar-imagenes:
    name: Construir sin publicar (${{ matrix.componente }})
    # Exactamente lo contrario de la condicion de publicar: todo evento ejecuta uno de los dos trabajos.
    if: >-
      !(github.repository == 'Kerosene21/ProcesosEmpresarialesWeb2630' &&
      ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')))
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - componente: backend
            contexto: .
            dockerfile: Dockerfile
            descripcion: API REST y vistas Thymeleaf de Procesos Empresariales
          - componente: frontend
            contexto: frontend
            dockerfile: frontend/Dockerfile
            descripcion: SPA Angular de Procesos Empresariales servida por nginx

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Calcular etiquetas y metadatos
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGEN_BASE }}-${{ matrix.componente }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=procesos-empresariales-${{ matrix.componente }}
            org.opencontainers.image.description=${{ matrix.descripcion }}

      - name: Construir la imagen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.componente }}
          provenance: mode=max
          sbom: true

  publicar:
    name: Publicar en GHCR (${{ matrix.componente }})
    # Solo en este repositorio: push a main o a una etiqueta de version, o ejecucion manual desde main.
    if: >-
      github.repository == 'Kerosene21/ProcesosEmpresarialesWeb2630' &&
      ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - componente: backend
            contexto: .
            dockerfile: Dockerfile
            descripcion: API REST y vistas Thymeleaf de Procesos Empresariales
          - componente: frontend
            contexto: frontend
            dockerfile: frontend/Dockerfile
            descripcion: SPA Angular de Procesos Empresariales servida por nginx

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Antes de iniciar sesion: una etiqueta solo se publica si su commit ya esta integrado en main.
      - name: Comprobar que la etiqueta pertenece a main
        if: github.ref_type == 'tag'
        env:
          ETIQUETA: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          commit=$(git rev-parse --verify "${GITHUB_SHA}^{commit}")
          if git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "La etiqueta ${ETIQUETA} (${commit}) pertenece al historial de main."
          else
            echo "::error::La etiqueta ${ETIQUETA} apunta a ${commit}, que no esta en origin/main; no se publica."
            exit 1
          fi

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-<commit> en main y X.Y.Z / X.Y en las etiquetas de version; nunca latest.
      - name: Calcular etiquetas y metadatos
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGEN_BASE }}-${{ matrix.componente }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=procesos-empresariales-${{ matrix.componente }}
            org.opencontainers.image.description=${{ matrix.descripcion }}
          annotations: |
            org.opencontainers.image.title=procesos-empresariales-${{ matrix.componente }}
            org.opencontainers.image.description=${{ matrix.descripcion }}

      - name: Construir y publicar la imagen
        id: construir
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.componente }}
          cache-to: type=gha,mode=max,scope=${{ matrix.componente }}
          provenance: mode=max
          sbom: true

      - name: Comprobar y mostrar el digest
        env:
          IMAGEN: ${{ env.IMAGEN_BASE }}-${{ matrix.componente }}
          DIGEST: ${{ steps.construir.outputs.digest }}
          ETIQUETAS: ${{ steps.meta.outputs.tags }}
        run: |
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Digest no valido: '$DIGEST'" >&2
            exit 1
          fi
          docker buildx imagetools inspect "${IMAGEN}@${DIGEST}"
          {
            echo "### ${IMAGEN}"
            echo
            echo "- Digest: \`${DIGEST}\`"
            echo "- Referencia para k8s/overlays/vm: \`${IMAGEN}@${DIGEST}\`"
            echo "- Etiquetas:"
            printf '%s\n' "$ETIQUETAS" | sed -e 's/^/  - `/' -e 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
