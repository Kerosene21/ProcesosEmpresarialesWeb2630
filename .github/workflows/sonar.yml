name: SonarQube Cloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, test and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: procesos_empresariales_test
          POSTGRES_USER: procesos_app
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U procesos_app -d procesos_empresariales_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_USERNAME: procesos_app
      DB_PASSWORD: ci_test_password
      SONAR_MAVEN_PLUGIN: org.sonarsource.scanner.maven:sonar-maven-plugin:5.9.0.7382

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Calcular la semana de la cache de SonarQube
        id: semana
        run: echo "valor=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ steps.semana.outputs.valor }}
          restore-keys: ${{ runner.os }}-sonar-

      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B verify "${SONAR_MAVEN_PLUGIN}:sonar"
