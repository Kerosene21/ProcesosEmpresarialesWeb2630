spring.application.name=ProcesosEmpresarialesWeb2630

# Carga opcional de un archivo .env local (no versionado) con las credenciales.
# Si el archivo no existe, la aplicacion arranca igual y usa las variables de entorno del sistema.
spring.config.import=optional:file:./.env[.properties]

# ===== Datasource (PostgreSQL) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/procesos_empresariales}
spring.datasource.username=${DB_USERNAME:procesos_app}
# Sin valor por defecto a proposito: si DB_PASSWORD no esta definida, la aplicacion falla al arrancar.
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
