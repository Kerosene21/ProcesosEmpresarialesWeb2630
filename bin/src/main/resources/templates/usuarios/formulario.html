<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear usuario</title>
    <link rel="stylesheet" th:href="@{/css/empresas.css}">
    <link rel="stylesheet" th:href="@{/css/usuarios.css}">
</head>
<body>
<main class="page-shell">
    <section class="panel" aria-labelledby="form-title">
        <p class="eyebrow">Administracion</p>
        <h1 id="form-title">Crear usuario</h1>
        <p class="intro">
            El usuario se crea dentro de tu empresa y entra con el correo y la contrasena que
            definas aqui. El correo es su identificador de acceso.
        </p>

        <form th:action="@{/usuarios}" th:object="${usuario}" method="post" novalidate>
            <label for="correo">Correo</label>
            <input id="correo" type="email" th:field="*{correo}" maxlength="180" autofocus>
            <small class="error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></small>

            <label for="password">Contrasena inicial</label>
            <input id="password" name="password" type="password" maxlength="100" autocomplete="new-password">
            <small class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>

            <label for="rol">Rol de acceso</label>
            <select id="rol" th:field="*{rol}">
                <option value="">Seleccione un rol</option>
                <option th:each="rol : ${roles}" th:value="${rol}" th:text="${rol}"></option>
            </select>
            <small class="error" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></small>

            <button type="submit">Crear usuario</button>
        </form>

        <div class="acciones">
            <a th:href="@{/usuarios}">Volver a los usuarios</a>
        </div>
    </section>
</main>
</body>
</html>
