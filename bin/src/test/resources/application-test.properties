# Configuracion exclusiva del perfil "test".

# URL FIJA A PROPOSITO: no usa placeholder de entorno.
# ddl-auto=create-drop destruye el esquema al terminar cada ejecucion, por lo que
# esta URL jamas debe poder redirigirse por una variable mal configurada.
spring.datasource.url=jdbc:postgresql://localhost:5432/procesos_empresariales_test
spring.datasource.username=${TEST_DB_USERNAME:procesos_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
