# Configuracion base para TODOS los tests.
# Activa el perfil "test" por defecto, de modo que cualquier test ejecutado desde
# Maven o desde el IDE quede aislado aunque olvide anotar @ActiveProfiles("test").
spring.profiles.active=test

# Carga opcional del .env local (no versionado) para obtener DB_PASSWORD.
spring.config.import=optional:file:./.env[.properties]
