<a class="saltar" href="#contenido">Saltar al contenido</a>

<header class="cabecera">
  <div class="contenedor cabecera__interior">
    <a class="marca" [routerLink]="autenticado() ? '/procesos' : '/iniciar-sesion'">Procesos Empresariales</a>
    <nav class="navegacion" aria-label="Navegación principal">
      @if (autenticado()) {
        <a
          class="navegacion__enlace"
          routerLink="/procesos"
          routerLinkActive="navegacion__enlace--activo"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          >Procesos</a
        >
        @if (puedeCrear()) {
          <a
            class="navegacion__enlace"
            routerLink="/procesos/nuevo"
            routerLinkActive="navegacion__enlace--activo"
            ariaCurrentWhenActive="page"
            >Nuevo proceso</a
          >
        }
        <a
          class="navegacion__enlace"
          routerLink="/roles-proceso"
          routerLinkActive="navegacion__enlace--activo"
          ariaCurrentWhenActive="page"
          >Roles de proceso</a
        >
        @if (esAdministrador()) {
          <a
            class="navegacion__enlace"
            routerLink="/usuarios"
            routerLinkActive="navegacion__enlace--activo"
            ariaCurrentWhenActive="page"
            >Usuarios</a
          >
        }
        <a
          class="navegacion__enlace"
          routerLink="/mi-empresa"
          routerLinkActive="navegacion__enlace--activo"
          ariaCurrentWhenActive="page"
          >Mi empresa</a
        >
      } @else {
        <a
          class="navegacion__enlace"
          routerLink="/iniciar-sesion"
          routerLinkActive="navegacion__enlace--activo"
          ariaCurrentWhenActive="page"
          >Iniciar sesión</a
        >
        <a
          class="navegacion__enlace"
          routerLink="/registro-empresa"
          routerLinkActive="navegacion__enlace--activo"
          ariaCurrentWhenActive="page"
          >Registrar empresa</a
        >
      }
    </nav>
    @if (autenticado()) {
      <div class="usuario">
        <button
          type="button"
          class="usuario__salir"
          [disabled]="cerrando()"
          (click)="cerrarSesion()"
        >
          {{ cerrando() ? 'Cerrando…' : 'Cerrar sesión' }}
        </button>
      </div>
    }
  </div>
</header>

<main id="contenido" class="contenedor principal" tabindex="-1">
  <router-outlet />
</main>

<footer class="pie">
  <div class="contenedor pie__interior">
    <span>Procesos Empresariales</span>
  </div>
</footer>
