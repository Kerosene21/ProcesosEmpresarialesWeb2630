# Overlay de la VM universitaria: MicroK8s 1.36 existente, Traefik del addon ingress y Calico.
# Es la version definitiva, solo por HTTPS (entrypoint websecure). La validacion previa por HTTP usa vm-http.
# Antes de aplicarlo: k8s/scripts/revisar-vm.sh, el almacenamiento de almacenamiento/ (aplicado aparte y con
# autorizacion) y los Secrets con KUBECTL="microk8s kubectl" k8s/scripts/crear-secretos.sh.
#   microk8s kubectl apply -k k8s/overlays/vm
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: procesos-empresariales
resources:
  - ../../base
components:
  - ../../components/limite-autenticacion
images:
  # Fijadas por digest (index multiplataforma con linux/amd64, SBOM y procedencia) publicado por el workflow
  # imagenes.yml desde main: backend del commit 2b4d97d (etiqueta sha-2b4d97d) y frontend del commit ff82aaf
  # (etiqueta sha-ff82aaf). Cada nueva version cambia estos digests.
  - name: procesos-empresariales-backend
    newName: ghcr.io/kerosene21/procesos-empresariales-backend
    digest: sha256:6944e7ad8d295cfb6292f05404e31574447c0a95f5a1ea7b9102d240d9d07290
  - name: procesos-empresariales-frontend
    newName: ghcr.io/kerosene21/procesos-empresariales-frontend
    digest: sha256:a2aa26ae92c4eb1b50fbf010955259dd500a3a7e0300c85051f84a60e05261ff
configMapGenerator:
  - name: procesos-configuracion
    behavior: merge
    literals:
      # Red de pods de Calico en MicroK8s (10.1.0.0/16 por defecto): solo desde ahi se aceptan X-Forwarded-*.
      - SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES=10\.1\.\d{1,3}\.\d{1,3}
patches:
  - target:
      kind: Ingress
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: todos
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
  # Solo los pods de Traefik del addon de MicroK8s: namespaceSelector y podSelector en el mismo elemento de
  # from, asi que deben cumplirse a la vez (namespace ingress y las dos etiquetas del pod).
  - target:
      kind: NetworkPolicy
      name: frontend
    patch: &traefik-microk8s |-
      - op: replace
        path: /spec/ingress/0/from
        value:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ingress
            podSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
                app.kubernetes.io/instance: traefik-ingress
  - target:
      kind: NetworkPolicy
      name: backend
    patch: *traefik-microk8s
  # La VM no tiene StorageClass por defecto: el PVC se enlaza al PV local de almacenamiento/ (Retain).
  # Sin fsGroup: con un PV local el kubelet cambiaria el grupo y daria lectura y escritura de grupo a todos los
  # archivos de datos en cada montaje. El directorio ya se crea con propietario 70:70 y permisos 0700.
  - target:
      kind: StatefulSet
      name: procesos-postgres
    patch: |-
      - op: remove
        path: /spec/template/spec/securityContext/fsGroup
      - op: add
        path: /spec/persistentVolumeClaimRetentionPolicy
        value:
          whenDeleted: Retain
          whenScaled: Retain
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: procesos-postgres-local
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 5Gi
