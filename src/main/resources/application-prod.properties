# Perfil de produccion para Docker y Kubernetes (SPRING_PROFILES_ACTIVE=prod).
# El esquema lo crean y versionan las migraciones de Flyway; Hibernate solo lo valida.
# Ningun secreto vive aqui: la conexion y la clave JWT llegan por variables de entorno.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

seguridad.jwt.secreto=${JWT_SECRET}
seguridad.refresco.cookie.segura=${COOKIE_SEGURA:true}
