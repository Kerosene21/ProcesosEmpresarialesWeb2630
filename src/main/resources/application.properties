spring.application.name=ProcesosEmpresarialesWeb2630

# Carga opcional de un archivo .env local (no versionado) con las credenciales.
# Si el archivo no existe, la aplicacion arranca igual y usa las variables de entorno del sistema.
spring.config.import=optional:file:./.env[.properties]

# ===== Datasource (PostgreSQL) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/procesos_empresariales}
spring.datasource.username=${DB_USERNAME:procesos_app}
# Sin valor por defecto a proposito: si DB_PASSWORD no esta definida, la aplicacion falla al arrancar.
spring.datasource.password=${DB_PASSWORD}

# ===== Migraciones =====
# Flyway solo se activa en el perfil prod. El perfil por defecto conserva ddl-auto=update para el
# desarrollo local; las bases existentes necesitan comparar su esquema y un baseline manual antes de usar Flyway.
spring.flyway.enabled=false

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT (token de acceso HS256) =====
# Clave en Base64 de al menos 32 bytes. Sin valor por defecto a proposito:
# si JWT_SECRET no esta definida o es demasiado corta, la aplicacion falla al arrancar.
seguridad.jwt.secreto=${JWT_SECRET}
seguridad.jwt.emisor=procesos-empresariales
seguridad.jwt.audiencia=procesos-empresariales-api
seguridad.jwt.duracion-acceso=15m
seguridad.jwt.tolerancia-reloj=30s

# ===== Refresh tokens (opacos, guardados como hash) =====
seguridad.refresco.duracion=7d
seguridad.refresco.duracion-maxima=30d
seguridad.refresco.gracia-rotacion=20s
seguridad.refresco.cookie.nombre=PE_REFRESH
seguridad.refresco.cookie.ruta=/api/auth
seguridad.refresco.cookie.segura=${COOKIE_SEGURA:true}
seguridad.refresco.cookie.same-site=Strict
seguridad.refresco.purga.cron=${PURGA_REFRESCO_CRON:0 17 * * * *}
