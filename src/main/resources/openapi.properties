# Configuracion de springdoc (OpenAPI / Swagger UI).
# OpenApiConfig la carga con @PropertySource para que aplique igual en la aplicacion y en los tests.

# Documenta solo la API REST (/api/**); las vistas Thymeleaf quedan fuera.
springdoc.paths-to-match=/api/**
springdoc.default-produces-media-type=application/json
springdoc.default-flat-param-object=true
# Evita que las respuestas HTML de MvcExceptionHandler se documenten en la API REST.
springdoc.override-with-generic-response=false
springdoc.writer-with-order-by-keys=true
springdoc.swagger-ui.tags-sorter=alpha
