# Salud para Docker y Kubernetes. Se carga con @PropertySource (SaludConfig) para que las pruebas
# usen la misma configuracion que la aplicacion. Las variables de entorno MANAGEMENT_* la sobrescriben.
# Solo se expone health y sin detalles. Liveness no depende de la base de datos; readiness si, para que
# el Service deje de enviar trafico a una replica sin conexion con PostgreSQL.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
