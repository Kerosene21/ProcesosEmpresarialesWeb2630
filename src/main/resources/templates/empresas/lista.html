<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Empresas registradas</title>
    <link rel="stylesheet" th:href="@{/css/empresas.css}">
</head>
<body>
<main class="page-shell">
    <section class="panel" aria-labelledby="lista-title">
        <p class="eyebrow">Empresas</p>
        <h1 id="lista-title">Empresas registradas</h1>
        <p class="intro">Cada empresa administra sus propios procesos de forma independiente.</p>

        <p class="success" th:if="${mensaje}" th:text="${mensaje}"></p>

        <p class="vacio" th:if="${#lists.isEmpty(empresas)}">
            Todavia no hay empresas registradas.
        </p>

        <table th:unless="${#lists.isEmpty(empresas)}">
            <thead>
            <tr>
                <th scope="col">Nombre</th>
                <th scope="col">NIT</th>
                <th scope="col">Correo de contacto</th>
                <th scope="col">Detalle</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="empresa : ${empresas}">
                <td th:text="${empresa.nombre}">Nombre</td>
                <td th:text="${empresa.nit}">NIT</td>
                <td th:text="${empresa.correoContacto}">Correo</td>
                <td><a th:href="@{/empresas/{id}(id=${empresa.id})}">Ver empresa</a></td>
            </tr>
            </tbody>
        </table>

        <div class="acciones">
            <a th:href="@{/empresas/nueva}">Registrar nueva empresa</a>
        </div>
    </section>
</main>
</body>
</html>
