<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Problema</title>
    <link rel="stylesheet" th:href="@{/css/empresas.css}">
</head>
<body>
<main class="page-shell">
    <section class="panel" aria-labelledby="problema-title">
        <p class="eyebrow">Procesos empresariales</p>
        <h1 id="problema-title" th:text="${titulo}">Problema</h1>
        <p class="error" th:text="${detalle}">Detalle del problema</p>

        <div class="acciones">
            <a th:href="@{/empresas}">Volver a mi empresa</a>
        </div>
    </section>
</main>
</body>
</html>
