  <!-- html nuevo para usar recursos diferentes -->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${mensajeThrow.id == null ? 'Nuevo message throw' : 'Editar message throw'}">Message throw</title>
    <link rel="stylesheet" th:href="@{/css/procesos.css}">
</head>
<body>
<main class="page-shell">
    <section class="form-panel" aria-labelledby="form-title">
        <p class="eyebrow">Mensajes y colaboración entre pools</p>
        <h1 id="form-title" th:text="${mensajeThrow.id == null ? 'Nuevo message throw' : 'Editar message throw'}">
            Message throw
        </h1>
        <p class="intro">Configura el mensaje que este proceso enviará. El código de referencia permite
            correlacionarlo posteriormente con un message catch.</p>

        <!-- El DTO controla el binding y el id permite distinguir crear de editar. -->
        <form th:action="@{/procesos/{procesoId}/mensajes-throw(procesoId=${procesoId})}"
              th:object="${mensajeThrow}" method="post" novalidate>
            <input type="hidden" th:field="*{id}">

            <label>Nombre
                <input type="text" th:field="*{nombre}" maxlength="150" required autofocus>
            </label>
            <small class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>

            <label>Código de referencia
                <input type="text" th:field="*{codigoReferencia}" maxlength="100" required>
            </label>
            <small class="error" th:if="${#fields.hasErrors('codigoReferencia')}"
                   th:errors="*{codigoReferencia}"></small>

                 <label>Contenido del mensaje
                     <textarea th:field="*{contenido}" rows="5"
                         placeholder="Ejemplo: numeroSolicitud (Long), estado (String)" required></textarea>
                 </label>
                 <small class="error" th:if="${#fields.hasErrors('contenido')}"
                     th:errors="*{contenido}"></small>

                 <label>Pool destino
                     <input type="text" th:field="*{poolDestino}" maxlength="150" required>
                 </label>
                 <small class="error" th:if="${#fields.hasErrors('poolDestino')}"
                     th:errors="*{poolDestino}"></small>

            <button type="submit" th:text="${mensajeThrow.id == null ? 'Guardar message throw' : 'Actualizar message throw'}">
                Guardar
            </button>
        </form>

        <div class="acciones">
            <a th:href="@{/procesos/{procesoId}/mensajes-throw(procesoId=${procesoId})}">Cancelar</a>
        </div>
    </section>
</main>
</body>
</html>
